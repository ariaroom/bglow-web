<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f7f3ec">
    <title>Mother · LOVE'S LAST LETTER</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Noto+Serif+KR:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="letter.css">
</head>

<body>
    <main class="letter-page">

        <header class="lp-header">
            <p class="lp-eyebrow">Immersive Solo Exhibition</p>
            <h1 class="lp-title">LOVE&rsquo;S LAST LETTER</h1>
            <p class="lp-chapter">Mother</p>
        </header>

        <section class="lp-player" id="player" data-state="idle">
            <button id="playBtn" class="lp-play" aria-label="Play">
                <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M7 4.5v15l13-7.5-13-7.5z" />
                </svg>
                <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="6" y="4.5" width="4" height="15" rx="1" />
                    <rect x="14" y="4.5" width="4" height="15" rx="1" />
                </svg>
                <svg class="icon-replay" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round">
                    <path d="M4 12a8 8 0 1 0 2.3-5.6" />
                    <path d="M6 3v4h4" />
                </svg>
            </button>
            <div class="lp-player-info">
                <p class="lp-player-title">Listen to the Letter</p>
                <p class="lp-player-sub" id="playerSub">Narration</p>
                <div class="lp-progress">
                    <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
                    <div class="lp-time"><span id="cur">0:00</span><span id="dur">–:––</span></div>
                </div>
            </div>
        </section>

        <section class="lp-scapes" id="scapes" hidden>
            <div class="lp-scapes-head">Now Playing</div>
            <div class="lp-scape-grid"></div>
        </section>

        <div class="lp-lang">
            <button type="button" data-lang="en" class="active">English</button>
            <button type="button" data-lang="ko">한국어</button>
        </div>

        <details class="lp-letter" open>
            <summary>
                <span>Read the Letter <span class="ko-label">편지 읽기</span></span>
                <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round">
                    <path d="M6 9l6 6 6-6" />
                </svg>
            </summary>
            <div class="lp-letter-body" id="letterBody" data-lang="en"></div>
        </details>

        <section class="lp-video">
            <video src="../assets/video/mother_answer.mp4" poster="../assets/video/mother_answer_poster.jpg"
                controls playsinline preload="metadata"></video>
            <p class="lp-video-caption">
                Mom&rsquo;s answer to &ldquo;What kind of daughter am I to you?&rdquo;
                <span class="ko-line">&ldquo;나는 엄마에게 어떤 딸이야?&rdquo;에 대한 엄마의 답변</span>
            </p>
        </section>

        <p class="lp-note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M4 13v-1a8 8 0 0 1 16 0v1" />
                <rect x="3" y="13" width="4" height="7" rx="2" />
                <rect x="17" y="13" width="4" height="7" rx="2" />
            </svg>
            Please use headphones for the full experience.
        </p>

        <footer class="lp-footer">Soohyun Aria Jo</footer>

    </main>

    <audio id="narration" preload="auto"></audio>

    <script>
        // NOTE: Mom's answer is the inline VIDEO above. The letter narration
        // is still coming — when it arrives (../assets/audio/mother_narration.m4a)
        // set the path below and the audio player reappears.
        window.LETTER_PAGE = {
            chapter: "mother",
            narration: null,
            soundscapes: [],
            letter: {
                ko: `엄마는
내가 이 세상에서 처음으로 사랑한 사람이야.

어렸을 때는 가끔,
엄마가 이 세상에 없으면 어떡하지 하는 생각이
너무 두려워서 혼자 많이 울었어.

그런데 지금도 마찬가지야.
엄마가 없는 내 삶은
아직도 상상할 수가 없어.

나는 여전히
엄마에게 자랑스러운 딸이 아닌 것 같고,
받은 사랑만큼 돌려주지 못한 것 같아서
미안한 마음이 들어.

그래서 가끔은 그런 생각을 해.
다음 생의 엄마는
누구를 위해 자신을 희생하지 않아도 되는 삶에서,
지금보다 더 많이 사랑받으며 살았으면 좋겠다고.

그리고 그 삶에서는
나를 만나지 않아도 괜찮을 만큼
온전히 행복했으면 좋겠다고.

엄마,
나는 엄마에게 어떤 딸이야?`,
                en: `Dear Mom,

You were the very first person
I ever loved in this life.

When I was young,
there were times when the thought of you
no longer being in this world
terrified me so much
that I would cry alone.

Even now, it is still the same.
I still cannot imagine
a life without you.

And still, I often feel
that I am not a daughter
you can truly be proud of.
I am sorry
that I have not loved you better,
or given back
as much as I have received.

So sometimes, I find myself thinking:
in your next life,
I hope you will live in a better world,
a life where you are loved more,
without having to give so much of yourself away.

And in that life,
I hope you will be so completely happy
that you would not need to meet me again.

Mom,
what kind of daughter am I to you?`
            }
        };
    </script>
    <script src="letter.js"></script>
    <script src="stamps.js"></script>
</body>

</html>
